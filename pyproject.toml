[project]
name = "lampe_cnn"
version = "0.1.0"
description = "Label-free histological identification of intraductal carcinoma of the prostate using deep learning on multimodal stimulated Raman scattering microscopy (LAMPE Lab @ Carleton University)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pretrained-microscopy-models",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "typer>=0.24.1",
]

[project.scripts]
lampe-cli = "lampe_cli.typer_entrypoint:app"

[tool.ruff.lint]
ignore = ["PLC0415"]  # allow imports outside top-level (intentional lazy loading for CLI)

[tool.pylint.'MESSAGES CONTROL']
disable = ["import-outside-toplevel"] # allow imports outside top-level (intentional lazy loading for CLI)

[tool.uv.sources]
pretrained-microscopy-models = { git = "https://github.com/nasa/pretrained-microscopy-models" }

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]
